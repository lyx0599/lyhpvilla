<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>楼梯系统 3D 验收预览</title>
  <style>
    body {
      margin: 0;
      background: #f5efe6;
      color: #1c1917;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      box-sizing: border-box;
      width: 1200px;
      padding: 34px;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 34px;
      letter-spacing: .04em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    figure {
      margin: 0;
      padding: 14px 14px 16px;
      border: 1px solid #e4d8c8;
      border-radius: 20px;
      background: #fffaf2;
      box-shadow: 0 16px 36px rgba(63, 52, 40, .09);
    }
    img {
      display: block;
      width: 100%;
      height: 355px;
      object-fit: cover;
      border-radius: 12px;
      background: #e7ded1;
    }
    figcaption {
      margin-top: 12px;
      font-size: 22px;
      font-weight: 800;
      color: #3f3428;
    }
  </style>
</head>
<body>
  <main>
    <h1>楼梯系统 3D 验收预览</h1>
    <section class="grid">
      <figure><img src="01-b1-ordinary-overview.png" alt="B1 普通总平面 3D"><figcaption>B1 普通总平面 3D</figcaption></figure>
      <figure><img src="02-b1-stair-front-panorama.png" alt="B1 楼梯正面"><figcaption>B1 楼梯正面</figcaption></figure>
      <figure><img src="03b-b1-opening-edge-overlook.png" alt="B1 挑空边缘俯视"><figcaption>B1 挑空边缘俯视</figcaption></figure>
      <figure><img src="04-shared-drawing-3d-structure.png" alt="Shared Drawing 3D / 结构图"><figcaption>Shared Drawing 3D / 结构图</figcaption></figure>
      <figure><img src="06-b2-stair-bottom-up.png" alt="B2 楼梯底部上行"><figcaption>B2 楼梯底部上行</figcaption></figure>
      <figure><img src="07-2f-stair-arrival.png" alt="2F 楼梯到达层"><figcaption>2F 楼梯到达层</figcaption></figure>
    </section>
  </main>
</body>
</html>

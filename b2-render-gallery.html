<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B2 活动收纳电视游戏渲染图</title>
    <style>
      :root {
        color: #111827;
        background: #f7f6f2;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 28px 56px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 28px;
        color: #475569;
        line-height: 1.7;
      }
      section {
        margin-top: 28px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      @media (max-width: 820px) {
        main {
          padding: 28px 16px 40px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>B2 活动收纳电视游戏渲染图</h1>
      <p>基于当前 B2 实际户型：W-B2-001 电视游戏墙，W-B2-011 户外用品洞洞板，W-B2-012 双采光天窗，柱子左侧书房和右侧活动区。</p>

      <section>
        <h2>方案平面预览</h2>
        <img src="b2-activity-storage-tv-preview.png" alt="B2 活动收纳电视游戏设计预览" />
      </section>

      <section>
        <h2>精装修氛围效果图</h2>
        <div class="grid">
          <img src="renders/b2/b2-atmosphere-05-birdseye-axonometric.png" alt="B2 鸟瞰轴测精装修效果图" />
          <img src="renders/b2/b2-atmosphere-01-overall.png" alt="B2 整体精装修氛围效果图" />
          <img src="renders/b2/b2-atmosphere-02-tv-lounge.png" alt="B2 客厅电视游戏区精装修效果图" />
          <img src="renders/b2/b2-atmosphere-03-activity-pegboard-skylights.png" alt="B2 活动区洞洞板和采光窗精装修效果图" />
          <img src="renders/b2/b2-atmosphere-04-study-slab-table.png" alt="B2 书房大板桌和纪念品柜精装修效果图" />
        </div>
      </section>

      <section>
        <h2>户型关系示意渲染</h2>
        <div class="grid">
          <img src="renders/b2/b2-render-01-overall-axonometric.png" alt="B2 整体轴测渲染" />
          <img src="renders/b2/b2-render-02-tv-game-lounge.png" alt="B2 客厅电视游戏区渲染" />
          <img src="renders/b2/b2-render-03-activity-pegboard-skylights.png" alt="B2 活动区和户外收纳墙渲染" />
          <img src="renders/b2/b2-render-04-study-slab-table.png" alt="B2 书房纪念品展示和原木大板桌渲染" />
        </div>
      </section>
    </main>
  </body>
</html>
